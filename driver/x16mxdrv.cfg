# x16mxdrv.cfg - X16MXDRV.BIN: raw image of four consecutive RAM banks, each at $A000
# (load it headerless to $A000 of the first bank; KERNAL LOAD continues into the next banks)
#   bank +0  FM core, platform, IRQ worker, API jump table
#   bank +1  PCM runtime: voices, mixer, sample directory
#   bank +2  loader: calibration, MDX sample scan, PDX streaming decoder
#   bank +3  entry table, PCM pack reader (x_pack), LOWA-LOWD images and their copy routine
#            (api_init), the worker's zero page
#            save / restore (unrolled) and its save area (XBSS, after the file's end)
# Low RAM $0400-$07FF (golden RAM) holds the IRQ entry, bank trampolines, the mixer's
# inner loops and three 64-byte mix buffers at $04C0, $05C0, $06C0.
MEMORY {
    ZP:     file = "", start = $0002, size = $001C, define = yes;   # borrowed: KERNAL r0-r13
    BANK0:  file = %O, start = $A000, size = $2000, fill = yes;
    BANK1:  file = %O, start = $A000, size = $2000, fill = yes;
    BANK2:  file = %O, start = $A000, size = $2000, fill = yes;
    BANK3:  file = %O, start = $A000, size = $2000;
    LOWA:   file = "", start = $0400, size = $00C0;
    LOWB:   file = "", start = $0500, size = $00C0;
    LOWC:   file = "", start = $0600, size = $00C0;
    LOWD:   file = "", start = $0700, size = $0100;
}
SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp;
    JMPTBL:   load = BANK0, type = ro;
    CODE:     load = BANK0, type = ro;
    RODATA:   load = BANK0, type = ro;
    BSS:      load = BANK0, type = bss, define = yes;
    PJMP:     load = BANK1, type = ro;
    PRODATA:  load = BANK1, type = ro, align = $100;
    PCODE:    load = BANK1, type = ro;
    PBSS:     load = BANK1, type = bss, define = yes, align = $100;
    LJMP:     load = BANK2, type = ro;
    LRODATA:  load = BANK2, type = ro, align = $100;
    LCODE:    load = BANK2, type = ro;
    LBSS:     load = BANK2, type = bss, define = yes;
    XJMP:     load = BANK3, type = ro;
    XCODE:    load = BANK3, type = ro;
    LOWA:     load = BANK3, run = LOWA, type = rw, define = yes;
    LOWB:     load = BANK3, run = LOWB, type = rw, define = yes;
    LOWC:     load = BANK3, run = LOWC, type = rw, define = yes;
    LOWD:     load = BANK3, run = LOWD, type = rw, define = yes;
    XBSS:     load = BANK3, type = bss;
    LOWBSS:   load = LOWD,  type = bss;
}
